<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concepts of Data Engineering</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f3f5f7;--surface:#fff;--ink:#14212b;--mute:#5b6b78;--line:#d5dde3;--accent:#0b7a75;--accent2:#3b6fd4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a22;--surface:#17252f;--ink:#e6eef3;--mute:#93a5b2;--line:#2b3d4a;--accent:#3fc2b9;--accent2:#7fa6f0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a22;--surface:#17252f;--ink:#e6eef3;--mute:#93a5b2;--line:#2b3d4a;--accent:#3fc2b9;--accent2:#7fa6f0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
#home{max-width:960px;margin:0 auto;padding:40px 16px}
h1{font-size:clamp(30px,6vw,52px);line-height:1.05;margin:0 0 10px;letter-spacing:-.025em}
.lede{color:var(--mute);max-width:56ch;margin:0 0 28px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0;cursor:pointer;overflow:hidden}
.card:hover{border-color:var(--accent)}
.card:focus-visible,.back:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.art{height:130px;border-bottom:1px solid var(--line);background:var(--bg)}
.art svg{width:100%;height:100%;display:block}
.body{padding:16px 18px 18px}
.body h2{margin:0 0 6px;font-size:24px;letter-spacing:-.01em}
.body p{margin:0 0 12px;color:var(--mute)}
.open{font-weight:700;color:var(--accent)}
#viewer{display:none;height:100%;flex-direction:column}
body.viewing #home{display:none}
body.viewing #viewer{display:flex}
.bar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.back{font:inherit;font-weight:500;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:7px 12px;border-radius:8px;cursor:pointer}
.bar strong{font-size:17px}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
</style>
</head>
<body>
<section id="home">
  <h1>Concepts of Data Engineering</h1>
  <p class="lede">Four ideas every data engineer relies on, as 3D models you can rotate and experiment with. Pick one to open it.</p>
  <div class="cards">
    <button class="card" data-open="idempotency" aria-label="Open the Idempotency 3D model">
      <div class="art" aria-hidden="true"><svg viewBox="0 0 320 130"><g fill="none" stroke="var(--mute)" stroke-width="2"><rect x="40" y="70" width="54" height="30" rx="3" fill="var(--accent)" stroke="none"/><rect x="40" y="40" width="54" height="30" rx="3" fill="var(--accent2)" stroke="none"/><path d="M110 70h60"/><path d="M162 62l10 8-10 8"/></g><rect x="200" y="70" width="54" height="30" rx="3" fill="var(--accent)"/><rect x="200" y="40" width="54" height="30" rx="3" fill="none" stroke="#c4452d" stroke-width="2" stroke-dasharray="5 4"/><text x="206" y="30" font-size="12" fill="var(--mute)" font-family="IBM Plex Mono,monospace">same table</text></svg></div>
      <div class="body"><h2>Idempotency</h2><p>Run a pipeline twice and still get the same result. See why retries duplicate data with INSERT but not with MERGE.</p><span class="open">Open the 3D model</span></div>
    </button>
    <button class="card" data-open="change-data-capture" aria-label="Open the Change Data Capture 3D model">
      <div class="art" aria-hidden="true"><svg viewBox="0 0 320 130"><rect x="30" y="60" width="50" height="40" rx="3" fill="var(--accent)"/><rect x="240" y="60" width="50" height="40" rx="3" fill="var(--accent)"/><rect x="96" y="92" width="128" height="8" rx="3" fill="var(--line)"/><circle cx="130" cy="78" r="8" fill="#2f9e5b"/><circle cx="160" cy="78" r="8" fill="#d49a1f"/><circle cx="190" cy="78" r="8" fill="#d6452d"/><text x="106" y="40" font-size="12" fill="var(--mute)" font-family="IBM Plex Mono,monospace">transaction log</text></svg></div>
      <div class="body"><h2>Change Data Capture</h2><p>Copy only what changed. Compare full reloads, query polling and log-based CDC, and watch which one misses deletes.</p><span class="open">Open the 3D model</span></div>
    </button>
    <button class="card" data-open="scd-type-2" aria-label="Open the SCD Type 2 3D model">
      <div class="art" aria-hidden="true"><svg viewBox="0 0 320 130"><rect x="40" y="62" width="50" height="40" rx="3" fill="var(--accent)" opacity=".35"/><rect x="110" y="62" width="50" height="40" rx="3" fill="var(--accent2)" opacity=".35"/><rect x="180" y="62" width="50" height="40" rx="3" fill="var(--accent)"/><path d="M40 118h190" stroke="var(--mute)" stroke-width="2"/><text x="40" y="40" font-size="12" fill="var(--mute)" font-family="IBM Plex Mono,monospace">one row per version</text></svg></div>
      <div class="body"><h2>SCD Type 2</h2><p>Keep history when a customer changes city. Compare overwriting with adding a new row and see which reports stay correct.</p><span class="open">Open the 3D model</span></div>
    </button>
    <button class="card" data-open="normalization" aria-label="Open the Normalization 3D model">
      <div class="art" aria-hidden="true"><svg viewBox="0 0 320 130"><rect x="30" y="40" width="130" height="50" rx="3" fill="var(--accent)" opacity=".4"/><path d="M170 65h30"/><g fill="var(--accent2)"><rect x="210" y="30" width="60" height="26" rx="3"/><rect x="210" y="64" width="60" height="26" rx="3"/><rect x="210" y="98" width="60" height="22" rx="3"/></g><text x="30" y="28" font-size="12" fill="var(--mute)" font-family="IBM Plex Mono,monospace">1NF, 2NF, 3NF</text></svg></div>
      <div class="body"><h2>Normalization</h2><p>Split one messy table into 1NF, 2NF and 3NF, then change a city and count how many cells you have to edit.</p><span class="open">Open the 3D model</span></div>
    </button>
  </div>
</section>
<section id="viewer">
  <div class="bar"><button class="back" id="back">Back to concepts</button><strong id="vtitle"></strong></div>
  <iframe id="frame" title="3D model" sandbox="allow-scripts"></iframe>
</section>
